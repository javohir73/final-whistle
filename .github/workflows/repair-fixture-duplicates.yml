# Repair the provider-cutover duplicate fixtures in the production database.
# Operating sequence: docs/RUNBOOK-FIXTURE-DUPLICATE-REPAIR.md.
#
# 1. Dispatch with apply=false (dry run, read-only). Read the evidence
#    artifact. If it lists conflicts, choose a policy and dispatch the dry run
#    again with on_conflict set, until it prints "ready_to_apply: true".
# 2. Dispatch with apply=true on the SAME commit, the SAME on_conflict value,
#    and expected_digest copied from that dry run's "digest:" line. The tool
#    recomputes the plan and refuses if the digest differs (another commit,
#    another policy, or data that changed in between).
#
# Approval gate (not configurable from repository files): create a GitHub
# environment named "production-database" with required reviewers (repo
# Settings -> Environments), then add `environment: production-database` to
# the job below. Until then the digest hand-off is the only guard between a
# dispatch and a production write.
name: repair-fixture-duplicates

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the repair (false performs a read-only dry run)
        required: true
        type: boolean
        default: false
      expected_digest:
        description: Required for apply. The "digest:" line from the dry run of this commit and policy
        required: false
        type: string
        default: ""
      on_conflict:
        description: Conflict policy, e.g. "match_picks=keep-donor" or "keep-survivor" (space or comma separated)
        required: false
        type: string
        default: ""

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head
      - name: Dry run
        if: ${{ !inputs.apply }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: backend:.
          ON_CONFLICT: ${{ inputs.on_conflict }}
        run: >-
          python -m pipeline.repair_fixture_duplicates --require-schema-head
          --evidence-file repair-evidence.json --on-conflict "$ON_CONFLICT"
      - name: Apply repair
        if: ${{ inputs.apply }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: backend:.
          ON_CONFLICT: ${{ inputs.on_conflict }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: >-
          test -n "$EXPECTED_DIGEST" &&
          python -m pipeline.repair_fixture_duplicates --require-schema-head
          --evidence-file repair-evidence.json --on-conflict "$ON_CONFLICT"
          --apply --expected-digest "$EXPECTED_DIGEST"
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: repair-evidence-${{ github.run_id }}
          path: repair-evidence.json
          if-no-files-found: warn
          retention-days: 90
