<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>FinalWhistle — You're offline</title>
    <style>
      /* Self-contained on purpose: this page must render with zero network and
         zero cached build assets, so it carries the direction G palette inline
         (white ground, ink text, the one brand green). One theme, no boot script. */
      :root {
        --bg: #ffffff;
        --fg: #14181f;
        --muted: #5b6470;
        --line: #e4e7e3;
        --brand: #0f4d3a;
        --brand-hover: #0b3d2e;
        color-scheme: light;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        padding: 24px 16px;
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
      }
      main { max-width: 30rem; }
      img { display: block; width: 48px; height: 48px; border-radius: 12px; margin-bottom: 24px; }
      h1 {
        font-size: 36px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.025em;
        margin-bottom: 12px;
      }
      p { color: var(--muted); }
      p + p { margin-top: 8px; }
      button {
        margin-top: 28px;
        min-height: 48px;
        padding: 0 24px;
        font: inherit;
        font-weight: 600;
        color: #ffffff;
        background: var(--brand);
        border: none;
        border-radius: 999px;
        cursor: pointer;
      }
      button:hover { background: var(--brand-hover); }
      button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" width="48" height="48" />
      <h1>You're offline</h1>
      <p>FinalWhistle needs a connection for live scores, tables and the model's calls, so none of that is shown out of date.</p>
      <p>Picks you have already locked are saved.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <footer>FinalWhistle. For analytics and entertainment only. Not betting advice.</footer>
    </main>
  </body>
</html>
